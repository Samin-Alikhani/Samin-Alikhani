<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Samin Alikhani — Cybersecurity</title>
<desc id="desc">Dark navy banner with burnt-orange accents and lightweight lettering. A TCP three-way handshake illustrates packet analysis: SYN, SYN-ACK, and ACK between a client and server.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#080d16"/></linearGradient>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#c12b08" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#background)"/>
<rect x="56" y="56" width="42" height="4" rx="2" fill="#c12b08"/>
<text x="56" y="101" fill="#d7dce3" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="4">CYBERSECURITY / PORTFOLIO</text>
<text x="53" y="170" fill="#f4f5f7" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="62" font-weight="300" letter-spacing="-1">Samin Alikhani</text>
<text x="56" y="215" fill="#bbc3ce" font-family="Arial,Helvetica,sans-serif" font-size="21">Security operations · Application security · Network security</text>
<line x1="884" y1="58" x2="884" y2="244" stroke="#ffffff" stroke-opacity=".09"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="1030" y="64" text-anchor="middle" fill="#8996a7" font-size="11" letter-spacing="2">PACKET ANALYSIS</text>
  <text x="930" y="101" text-anchor="middle" fill="#d7dce3" font-size="12">CLIENT</text>
  <text x="1130" y="101" text-anchor="middle" fill="#d7dce3" font-size="12">SERVER</text>
  <path d="M930 114V238M1130 114V238" fill="none" stroke="#536174" stroke-opacity=".45" stroke-dasharray="3 6"/>
  <g fill="none" stroke="#c12b08" stroke-width="1.5" marker-end="url(#arrow)">
